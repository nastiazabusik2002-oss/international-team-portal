name: DB Health Check

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase data
        run: |
          curl -s \
            "https://eyxwtvysqnndubemrrok.supabase.co/rest/v1/portal_data?key=eq.portal_v6&select=value" \
            -H "apikey: sb_publishable_L21Q_G9LvdpUt_jjm6pAxQ_XXdcDNw0" \
            -H "Authorization: Bearer sb_publishable_L21Q_G9LvdpUt_jjm6pAxQ_XXdcDNw0" \
            -o /tmp/db.json

          python3 << 'PYEOF'
          import json, sys, urllib.request, urllib.parse, os

          TOKEN = os.environ['TELEGRAM_TOKEN']
          CHAT_ID = os.environ['TELEGRAM_CHAT_ID']

          def send(msg):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
              data = urllib.parse.urlencode({'chat_id': CHAT_ID, 'text': msg}).encode()
              urllib.request.urlopen(url, data)

          with open('/tmp/db.json') as f:
              rows = json.load(f)

          if not rows or not rows[0].get('value'):
              send("🔴 TTN Portal: дані порожні або недоступні!")
              sys.exit(1)

          db = json.loads(rows[0]['value'])
          staff = db.get('staff', [])
          schedule = db.get('schedule', {})
          size = len(rows[0]['value'])

          errors = []
          if len(staff) < 10:
              errors.append(f"Мало агентів: {len(staff)}")
          if size < 50000:
              errors.append(f"Дані підозріло малі: {size} байт")
          if not schedule:
              errors.append("Розклад порожній")

          if errors:
              msg = "🔴 TTN Portal — ПРОБЛЕМА:\n" + "\n".join(f"• {e}" for e in errors)
              send(msg)
              print(msg)
              sys.exit(1)
          else:
              msg = f"✅ TTN Portal OK\nАгентів: {len(staff)}\nРозмір: {round(size/1024)}KB"
              send(msg)
              print(msg)
          PYEOF
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
